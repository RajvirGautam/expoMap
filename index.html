<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>expoMap</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>expoMap</h1>
    <button id="theme" class="theme-toggle" type="button" aria-label="Toggle dark mode">◐</button>
    <ul class="legend">
      <li><button type="button" class="legend__item" data-category="hardware"><span class="swatch booth--hardware"></span>Hardware</button></li>
      <li><button type="button" class="legend__item" data-category="software"><span class="swatch booth--software"></span>Software</button></li>
      <li><button type="button" class="legend__item" data-category="startup"><span class="swatch booth--startup"></span>Startups</button></li>
      <li><button type="button" class="legend__item" data-category="food"><span class="swatch booth--food"></span>Food</button></li>
      <li><button type="button" class="legend__item" data-category="info"><span class="swatch booth--info"></span>Info</button></li>
    </ul>
  </header>
  <main>
    <div class="search">
      <input id="search" type="search" placeholder="Search booths (press / to focus)" autocomplete="off">
    </div>
    <div id="map" class="map"></div>
    <aside id="details" class="details" aria-live="polite">
      <p class="details__empty">Select a booth to see details.</p>
    </aside>
  </main>
  <script src="app.js"></script>
</body>
</html>
