<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>expoMap</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>expoMap</h1>
    <ul class="legend">
      <li><span class="swatch booth--hardware"></span>Hardware</li>
      <li><span class="swatch booth--software"></span>Software</li>
      <li><span class="swatch booth--startup"></span>Startups</li>
      <li><span class="swatch booth--food"></span>Food</li>
      <li><span class="swatch booth--info"></span>Info</li>
    </ul>
  </header>
  <main>
    <div class="search">
      <input id="search" type="search" placeholder="Search booths (press / to focus)" autocomplete="off">
    </div>
    <div id="map" class="map"></div>
    <aside id="details" class="details">
      <p class="details__empty">Select a booth to see details.</p>
    </aside>
  </main>
  <script src="app.js"></script>
</body>
</html>
